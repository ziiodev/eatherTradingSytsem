# apps/api/alembic.ini — Alembic configuration for the Aether backend.
#
# `sqlalchemy.url` is intentionally left blank: env.py resolves it from the
# DATABASE_URL environment variable. This keeps secrets out of the repo
# and makes the same migration tree work for local dev, CI, and prod.
#
# Invoke from this directory:
#   uv run alembic upgrade head
#   uv run alembic downgrade base
#   uv run alembic current
#
# `version_locations` and `version_path_separator` keep us on Alembic
# defaults — single linear history under alembic/versions/.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# Where new migrations are placed.
version_locations = %(here)s/alembic/versions
version_path_separator = os
# Use UTC for timestamped revisions if/when we move away from numbered ones.
timezone = UTC
# Numbered revisions (0001_, 0002_, ...) are chosen for chronological readability
# in this monorepo. file_template is only consulted on `alembic revision`.
file_template = %%(rev)s_%%(slug)s

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
