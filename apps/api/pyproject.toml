# apps/api/pyproject.toml — Aether backend (FastAPI) Python project.
#
# Tooling = uv (charter hard rule: no poetry, no pip-tools). Run:
#   uv lock && uv sync
# from this directory to materialise the venv and lockfile.
#
# Phase 3 extends Phase 2's minimal deps with the full FastAPI surface,
# auth (argon2id + JWT), structured logging, and HTTP test client.
#
# Lint/format/type-check are configured at the repo root pyproject.toml
# (ruff + mypy). Do not duplicate those tables here.

[project]
name = "aether-api"
version = "0.0.1"
description = "Aether Trading System — FastAPI backend."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Aether Team" }]

dependencies = [
    # Async ORM + driver. SQLAlchemy 2.0 async is the chosen ORM (see design.md).
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    # Migrations.
    "alembic>=1.13,<2.0",
    # HTTP / web framework.
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Pydantic with the [email] extra so EmailStr (used in auth DTOs) resolves
    # `email-validator` at install time rather than blowing up at import time.
    # Pinned to >=2.9 to match FastAPI 0.115's pydantic floor.
    "pydantic[email]>=2.9,<3.0",
    # Settings loader — pydantic-settings reads .env directly.
    "pydantic-settings>=2.5,<3.0",
    # Password hashing — argon2id (charter mandate).
    "argon2-cffi>=23.1,<24.0",
    # JWT (HS256 access tokens). cryptography extra keeps the door open for RS256.
    "pyjwt[crypto]>=2.9,<3.0",
    # TOTP (RFC 6238) — issued by /api/me/mfa/setup, verified by the
    # login two-step in /api/auth/login/mfa. The library is pure-Python
    # and only used for HMAC-SHA-1 over time-step counters; no broader
    # dependency tree.
    "pyotp>=2.9,<3.0",
    # Structured logging core (replaces python-json-logger). The processor chain
    # bridges stdlib (uvicorn, sqlalchemy) → JSON via ProcessorFormatter so a
    # single stream of JSON lines hits stdout.
    "structlog>=24.4,<26.0",
    # Async HTTP client — used by tests AND by future server-side calls (MCP, etc.).
    "httpx>=0.27,<1.0",
    # python-dotenv is still useful for Alembic CLI invocations outside the FastAPI app.
    "python-dotenv>=1.0,<2.0",
    # Observability stack — every component is feature-flagged at runtime, so
    # an unconfigured environment (no SENTRY_DSN / OTEL_EXPORTER_OTLP_ENDPOINT
    # / METRICS_ENABLED) keeps behaving exactly like the unobserved bootstrap.
    "sentry-sdk[fastapi]>=2.18,<3.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1.0",
    "opentelemetry-instrumentation-asgi>=0.48b0,<1.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    # Per-project Docker orchestration — aiodocker speaks the Engine HTTP
    # API over the tecnativa/docker-socket-proxy sidecar (see
    # docker-compose.yml). Pinned <1.0; the 0.x line is the only published
    # series at time of writing.
    "aiodocker>=0.22,<1.0",
    # Jinja2 renders the templated default Dockerfile in
    # ``aether_api.docker_control.dockerfile``. autoescape=True is paired
    # with the explicit ``sanitize.py`` allowlist — Jinja's autoescape is
    # the second line of defence, never the first.
    "jinja2>=3.1,<4.0",
    # APScheduler 3.x drives the Sleep Phase Micro / Profundo per-project
    # jobs. SQLAlchemy jobstore lives on the same Postgres instance so
    # restarts don't lose the job table. Feature-flagged at boot via
    # ``AETHER_SLEEP_SCHEDULER_ENABLED`` — see core/settings.py.
    "apscheduler>=3.10,<4.0",
    # Anthropic SDK — powers the one-shot MQL5→Python translator
    # (``POST /api/tools/mql5-to-python``). Feature-flagged via
    # ``MQL5_TRANSLATOR_ENABLED``; the dep ships unconditionally because
    # the import surface is tiny and lazy. Charter alignment: we already
    # build on Claude/MCP, so the same provider is reused here.
    "anthropic>=0.39,<1.0",
]

[project.scripts]
# Convenience entry point so `aether-api` (after `uv sync`) boots uvicorn.
aether-api = "aether_api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    # ASGI lifespan adapter for httpx.AsyncClient against the FastAPI app.
    "asgi-lifespan>=2.1,<3.0",
    # Time travel for lockout / token expiry tests.
    "freezegun>=1.5,<2.0",
    # Used by tests/test_migrations.py to spin an ephemeral Postgres for
    # reversibility checks. Skipped automatically if Docker is unavailable.
    "testcontainers[postgresql]>=4.0,<5.0",
    # Sync driver for Alembic offline / verification paths and for the
    # testcontainers session that runs the migration command synchronously.
    "psycopg[binary]>=3.1,<4.0",
    # Lint + type-check tooling. Pinned here so `uv run ruff`/`uv run mypy`
    # (used by CI and the Makefile) work without falling back to the slower
    # `uvx` download-on-demand path.
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_api"]

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that need a live Postgres (Docker / DATABASE_URL). Skipped by default in CI without infra.",
    "release_gate: tests that MUST pass before any release. A failure here is a release blocker; adding new release_gate tests requires architectural review.",
]
