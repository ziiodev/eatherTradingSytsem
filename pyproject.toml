# Root pyproject.toml — SHARED tooling configuration only.
#
# This file does NOT declare a Python package. It exists to centralize ruff and
# mypy configuration for every Python project that lives under apps/ or
# packages/ in the future (e.g. apps/api/).
#
# `mcp/` is intentionally EXCLUDED from both ruff and mypy here: it is a
# pre-existing project with its own pyproject.toml, lockfile, and tooling
# preferences. Do not collapse them into this root config.

# -----------------------------------------------------------------------------
# ruff: lint + format
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "mcp",
    ".venv",
    "node_modules",
    ".next",
    "dist",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
# Curated rule set:
#   E, W   — pycodestyle errors/warnings
#   F      — pyflakes
#   I      — isort (import sorting)
#   B      — flake8-bugbear (likely bugs)
#   C4     — flake8-comprehensions
#   UP     — pyupgrade (modernize syntax)
#   ASYNC  — flake8-async (async pitfalls)
#   SIM    — flake8-simplify
select = ["E", "F", "W", "I", "B", "C4", "UP", "ASYNC", "SIM"]
ignore = [
    # Allow assertions in tests (handled per-folder if needed).
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
"**/migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------------------------
# mypy: strict-ish baseline
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict_optional = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
show_error_codes = true
pretty = true
exclude = [
    "^mcp/",
    "^\\.venv/",
    "^node_modules/",
    "^\\.next/",
    "^dist/",
    "^\\.mypy_cache/",
    "^\\.ruff_cache/",
    "^\\.pytest_cache/",
]

# Tests may use untyped fixtures freely.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
